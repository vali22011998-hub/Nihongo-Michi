<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo Michi</title>
<style>
:root{--bg:#faf8f5;--cd:#fff;--tx:#1f2328;--mu:#6b7280;--ac:#c2410c;--ln:#e7e2da;--ok:#15803d;--bd:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16171a;--cd:#202226;--tx:#ececec;--mu:#9aa0a8;--ac:#fb923c;--ln:#32353b;--ok:#4ade80;--bd:#f87171}}
:root[data-theme=dark]{--bg:#16171a;--cd:#202226;--tx:#ececec;--mu:#9aa0a8;--ac:#fb923c;--ln:#32353b;--ok:#4ade80;--bd:#f87171}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:20px 0 6px}h3{font-size:15px;margin:14px 0 4px;color:var(--ac)}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin:10px 0}
.mu{color:var(--mu);font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;padding:10px 14px;margin:4px 0}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.o{display:block;width:100%;text-align:left}.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.o.no{border-color:var(--bd);background:color-mix(in srgb,var(--bd) 15%,transparent)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.n{font-size:26px;font-weight:700}
.s{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}.s.l{opacity:.5;cursor:default}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;margin:0;padding:12px 2px;font-size:12px;background:none;color:var(--mu)}nav button.on{color:var(--ac);font-weight:700}
.jp{font-size:20px}.t{overflow-x:auto}table{border-collapse:collapse}td,th{border:1px solid var(--ln);padding:4px 10px;text-align:center}
.sy{background:#0b1226;color:#cfe6ff;border:1px solid #3b82f6;border-radius:6px;box-shadow:0 0 18px #3b82f666,inset 0 0 14px #3b82f622;padding:12px 16px;font-family:ui-monospace,Menlo,monospace}
.sy .bar{background:#1e2a4a}.sy .bar i{background:linear-gradient(90deg,#2563eb,#60a5fa);box-shadow:0 0 8px #60a5fa}.sy .mu{color:#8aa4c8}
.sh{letter-spacing:.2em;color:#60a5fa;font-size:12px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0;font-size:13px}
.tt{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;text-align:center;animation:fi .25s}
.nf rt{display:none}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 45%),radial-gradient(circle at 85% 80%,#3b82f633,transparent 45%);animation:dr 14s ease-in-out infinite alternate}@keyframes dr{to{transform:translate(-3%,2%) scale(1.08);filter:hue-rotate(25deg)}}
main{position:relative;z-index:1}nav{z-index:5}
.bolt{position:fixed;top:0;height:55vh;width:90px;pointer-events:none;z-index:15;opacity:0;filter:drop-shadow(0 0 8px #60a5fa) drop-shadow(0 0 18px #3b82f6);animation:bl .7s forwards}@keyframes bl{0%,100%{opacity:0}8%,30%{opacity:var(--o,1)}18%{opacity:.15}}
.flash{position:fixed;inset:0;background:#cfe6ff;z-index:14;pointer-events:none;animation:fh .5s forwards}@keyframes fh{0%{opacity:.5}100%{opacity:0}}
.nm{font-size:26px;font-weight:800;line-height:1.2;background:linear-gradient(90deg,var(--tx),var(--ac),var(--tx));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shm2 4s linear infinite}@keyframes shm2{to{background-position:200% 0}}
.ttl{color:#fbbf24;font-weight:600;text-shadow:0 0 10px #fbbf2488;animation:rs .8s both,glw 2.4s ease-in-out .8s infinite alternate}@keyframes rs{from{opacity:0;letter-spacing:.4em}}@keyframes glw{from{text-shadow:0 0 4px #fbbf2455}to{text-shadow:0 0 16px #fbbf24}}
main>.sy{animation:up .4s both,sgl 3s ease-in-out .4s infinite alternate}@keyframes sgl{to{box-shadow:0 0 26px #3b82f6aa,inset 0 0 18px #3b82f633}}
.sy .bar i{background-size:200% 100%;animation:gr .9s both,shm2 2.5s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes gr{from{width:0}}@keyframes pop{50%{transform:scale(1.03)}}
main>*{animation:up .4s both}main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}
.bar i{animation:gr .9s both;transition:width .8s cubic-bezier(.2,.8,.2,1)}.o{animation:up .3s both}.o.ok{animation:pop .3s}
button{transition:transform .12s,box-shadow .2s}button:active{transform:scale(.96)}button.p:hover{box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 45%,transparent)}.hv{transition:transform .2s}.hv:hover{transform:translateY(-2px)}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'▾';float:right;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tt.big{top:35%;min-width:220px;padding:18px 26px}
@keyframes fi{from{opacity:0;transform:translate(-50%,-8px)}}
:root,:root:not([data-theme=light]),:root[data-theme=dark]{--bg:#070b16;--cd:#0f1629;--tx:#e6edff;--mu:#8b9bbd;--ac:#f59e0b;--ln:#243256;--ok:#4ade80;--bd:#f87171}
#bg{overflow:hidden;animation:none;background:radial-gradient(120% 60% at 15% 0,#1d4ed82e,transparent 55%),radial-gradient(100% 70% at 85% 100%,#2563eb3d,transparent 60%),#070b16}

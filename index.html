'N5.0.0':{k:8,g:'Membuat kalimat "A adalah B", bentuk tanya, dan bentuk negatif sopan.',

'L0.0.3':{k:25,g:'Membaca dakuten, handakuten, yoon, っ kecil, dan vokal panjang.',
core:'<p><b>Dakuten ゛</b> membuat bunyi bersuara: か→が ga, さ→ざ za, た→だ da, は→ば ba. <b>Handakuten ゜</b> hanya pada baris は: ぱ pa. Khusus: じ ji, ず zu.</p><p><b>Yoon</b>: huruf i + や/ゆ/よ kecil menjadi satu suku kata: きゃ kya, しゅ shu, ちょ cho, にゃ nya, りょ ryo.</p><p><b>っ kecil</b> menggandakan konsonan berikutnya (jeda singkat): きって kitte. <b>Vokal panjang</b> dibaca dua ketukan: おおきい ookii, おう/えい dibaca oo/ee.</p>',
ex:'<p class=jp>がっこう gakkou – sekolah<br>ざっし zasshi – majalah<br>きょう kyou – hari ini<br>おおきい ookii – besar<br>びょういん byouin – rumah sakit</p>',
cmp:'ば (dakuten) vs ぱ (handakuten); ちゅう (chuu, panjang) vs ちゅ (chu, pendek); おばさん (bibi) vs おばあさん (nenek).',

e:[['しゅ dibaca?',['shu','su','chu','sho'],'しゅ = shu.'],['Fungsi っ kecil di tengah kata?',['Menggandakan konsonan berikutnya','Memanjangkan vokal','Dibaca "tsu"','Penanda tanya'],'っ = jeda/konsonan rangkap.'],['おおきい dibaca?',['ookii','okii','oukii','ooki'],'おお = oo (panjang).'],['ざ dibaca?',['za','sa','ta','da'],'さ + ゛ = ざ (za).'],['ちょ dibaca?',['cho','chu','cha','shi'],'ちょ = cho.']]},
'L0.1.0':{k:25,g:'Membaca 25 katakana pertama: baris ア, カ, サ, タ, ナ.',

'L0.1.1':{k:30,g:'Membaca katakana baris ハ sampai ン, dakuten, dan kombinasi kata serapan.',

'N5.0.2':{k:8,g:'Membuat pertanyaan dengan kata tanya dan partikel か.',
core:'<p>Kata tanya: <b>なに/なん</b> apa, <b>だれ</b> siapa, <b>どこ</b> di mana, <b>いつ</b> kapan, <b>いくら</b> berapa harga, <b>なんじ</b> jam berapa. Kalimat tanya = kalimat biasa + <b>か</b>. Jawabannya tidak memakai か.</p>',

'N5.1.0':{k:10,g:'Membentuk kata kerja sopan: kini, negatif, lampau.',

'N5.1.1':{k:8,g:'Memakai partikel を, に, で, dan へ dengan tepat.',

});

'L0.2.0':{k:6,g:'Memahami kanji, onyomi, kunyomi, furigana, okurigana, dan urutan goresan dasar.',
core:'<p><b>Kanji</b> berasal dari aksara Tionghoa. Satu kanji punya makna dan biasanya dua jenis bacaan:</p><p><b>Onyomi (音読み)</b>: bacaan dari bunyi Cina, dipakai dalam kata gabungan, misalnya 火山 かざん.<br><b>Kunyomi (訓読み)</b>: bacaan asli Jepang, dipakai sendiri atau dengan okurigana, misalnya 山 やま dan 食べる たべる.</p><p><b>Furigana</b> adalah hiragana kecil di atas kanji sebagai petunjuk baca. <b>Okurigana</b> adalah kana yang mengikuti kanji (食<u>べる</u>).</p><p>Urutan goresan: atas ke bawah, kiri ke kanan, garis datar sebelum garis tegak.</p>'+T(0,[['日','ニチ / ひ','hari'],['山','サン / やま','gunung'],['水','スイ / みず','air']]),
ex:'<p class=jp>'+R('山','やま')+'は'+R('高','たか')+'いです。<br><span class=mu>Gunungnya tinggi.</span><br>'+R('水','みず')+'を'+R('飲','の')+'みます。<br><span class=mu>Minum air (kunyomi).</span><br>'+R('火山','かざん')+' <span class=mu>gunung berapi (onyomi).</span></p>',
cmp:'Onyomi muncul pada kata dua kanji atau lebih (火山). Kunyomi muncul pada kanji tunggal atau dengan okurigana (山, 食べる). Ada pengecualian, jadi pelajari kanji lewat kata, bukan sendirian.',
mis:'Membaca semua kanji dengan onyomi; mengabaikan okurigana (食べる bukan しょくる); menghafal kanji tunggal tanpa kata contohnya.',
p:[['山 berdiri sendiri dibaca?',['やま','さん','せん','かわ'],'Berdiri sendiri biasanya kunyomi: やま.'],['Furigana adalah?',['Hiragana kecil di atas kanji sebagai petunjuk baca','Huruf latin di bawah kanji','Tanda baca','Kanji khusus'],'Furigana = petunjuk baca.'],['Urutan goresan umum?',['Atas ke bawah, kiri ke kanan','Bawah ke atas','Kanan ke kiri','Acak'],'Atas ke bawah, kiri ke kanan.']],
e:[['Onyomi biasanya dipakai pada?',['Kata gabungan kanji','Nama orang saja','Kata kerja saja','Partikel'],'Onyomi umum di kata gabungan.'],['水 berdiri sendiri (air)?',['みず','すい','かわ','ひ'],'みず = kunyomi.'],['Bagian べる pada 食べる disebut?',['Okurigana','Furigana','Radikal','Katakana'],'Okurigana.'],['日 pada 日曜日 (にちようび) dibaca?',['にち','ひ','か','じつ'],'Bacaan on: にち.'],['Mana yang benar?',['Garis datar umumnya sebelum garis tegak','Garis tegak selalu duluan','Kanan duluan','Acak'],'Aturan umum goresan.']]},
'N5.2.0':{k:12,g:'Memakai kata tunjuk これ/それ/あれ dan partikel の, も, と.',
core:'<p><b>これ</b> ini (dekat saya), <b>それ</b> itu (dekat Anda), <b>あれ</b> itu (jauh dari keduanya), <b>どれ</b> yang mana. Sebelum kata benda: <b>この・その・あの・どの</b> + kata benda.</p><p><b>の</b> menandai kepemilikan: わたしの本. <b>も</b> = juga. <b>と</b> = dan (menghubungkan kata benda).</p>',
ex:'<p class=jp>これはわたしの'+R('本','ほん')+'です。<br><span class=mu>Ini buku saya.</span><br>あれも'+R('本','ほん')+'ですか。<br><span class=mu>Itu juga buku?</span><br>'+R('本','ほん')+'とノートです。 <span class=mu>Buku dan catatan.</span></p>',
cmp:'これ berdiri sendiri; この harus diikuti kata benda (この本). も menggantikan は, bukan ditambahkan: わたしも学生です.',
mis:'Menulis これ本です (seharusnya この本); わたしもは (salah); memakai と untuk menghubungkan kalimat atau kata kerja.',
p:[['Benda dekat penutur?',['これ','それ','あれ','どれ'],'これ = dekat penutur.'],['Lengkapi: ___本は私のです。',['この','これ','それ','あれ'],'Sebelum kata benda: この.'],['わたし__本 (buku saya)',['の','は','を','も'],'の = milik.']],
e:[['Arti も?',['juga','dan','tetapi','atau'],'も = juga.'],['"A dan B" untuk kata benda?',['と','の','も','は'],'と = dan.'],['"Yang mana?" =',['どれ','これ','それ','あれ'],'どれ.'],['Benda jauh dari keduanya?',['あれ','これ','それ','どれ'],'あれ.'],['Kalimat benar?',['あの人は先生です','あれ人は先生です','あの人を先生です','あれの人は先生です'],'あの + kata benda.']]},
'N5.2.1':{k:10,g:'Menyatakan keberadaan dengan あります/います dan menyebut letak.',
core:'<p><b>あります</b> untuk benda mati dan tumbuhan, <b>います</b> untuk makhluk hidup. Pola: <b>Tempat に Benda が あります/います</b>. Negatif: ありません / いません.</p><p>Letak: <b>上</b> うえ atas, <b>下</b> した bawah, <b>中</b> なか dalam, <b>前</b> まえ depan, <b>後ろ</b> うしろ belakang, <b>隣</b> となり sebelah. Menanyakan letak: <b>Benda は Tempat に あります</b>.</p>',
ex:'<p class=jp>つくえの'+R('上','うえ')+'に'+R('本','ほん')+'があります。<br><span class=mu>Di atas meja ada buku.</span><br>'+R('猫','ねこ')+'がいます。 <span class=mu>Ada kucing.</span><br>'+R('駅','えき')+'はどこにありますか。 <span class=mu>Stasiun ada di mana?</span></p>',
cmp:'が memperkenalkan sesuatu yang ada; は dipakai ketika benda sudah diketahui dan kita menanyakan letaknya. あります (benda mati) vs います (makhluk hidup).',
mis:'ねこがあります (salah, seharusnya います); menaruh posisi sebelum benda tanpa の (つくえ上); memakai で, bukan に, untuk keberadaan.',
p:[['Untuk benda mati dipakai?',['あります','います','いきます','です'],'あります = benda mati.'],['Lengkapi: つくえの うえ__ ほんが あります',['に','で','を','と'],'Keberadaan: に.'],['Arti した?',['bawah','atas','dalam','depan'],'した = bawah.']],
e:[['Arti なか?',['dalam','luar','atas','depan'],'なか = dalam.'],['Ada seekor anjing: いぬ__います',['が','を','で','の'],'が.'],['Negatif います?',['いません','ありません','いるません','いなません'],'いません.'],['Arti となり?',['sebelah','belakang','bawah','tengah'],'となり = sebelah.'],['えきはどこにありますか =',['Di mana stasiun?','Kapan stasiun?','Apa stasiun?','Siapa stasiun?'],'どこ = di mana.']]},
'N5.2.2':{k:8,g:'Mengajak dengan ましょう/ませんか dan meminta dengan を ください.',
core:'<p><b>V〜ましょう</b> = mari ~ (ajakan). <b>V〜ませんか</b> = maukah ~? (undangan halus). <b>N を ください</b> = tolong beri ~.</p><p>Jawaban setuju: <b>はい、V〜ましょう</b> atau <b>いいですね</b>.</p>',
ex:'<p class=jp>いっしょに'+R('行','い')+'きましょう。<br><span class=mu>Mari pergi bersama.</span><br>コーヒーを'+R('飲','の')+'みませんか。<br><span class=mu>Mau minum kopi?</span><br>'+R('水','みず')+'をください。 <span class=mu>Tolong air.</span></p>',
cmp:'ませんか lebih halus dan memberi pilihan; ましょう lebih langsung, mengajak. ください hanya dipakai setelah kata benda + を pada tahap ini.',
mis:'Menjawab ませんか dengan ません (artinya menolak keras); memakai ください setelah kata kerja bentuk ます; melupakan を sebelum ください.',
p:[['Arti 行きましょう?',['Mari pergi','Apakah pergi?','Tidak pergi','Sudah pergi'],'~ましょう = mari.'],['Lengkapi: コーヒー__ ください',['を','に','で','と'],'Objek = を.'],['Arti ください?',['tolong beri','mari','tidak','terima kasih'],'ください = tolong beri.']],
e:[['"Mari makan" =',['食べましょう','食べません','食べました','食べますか'],'~ましょう.'],['Bacaan ましょう?',['mashou','masou','mashuu','mashiyo'],'ましょう = mashou.'],['水をください =',['Minta air','Minum air','Tidak ada air','Air ada di sini'],'を ください = minta.'],['Undangan halus?',['飲みませんか','飲みました','飲みません','飲みますか'],'~ませんか = maukah.'],['Setuju atas 行きませんか?',['はい、行きましょう','はい、行きません','いいえ、行きましょう','はい、行きました'],'Setuju = ましょう.']]},
'N5.2.3':{k:14,g:'Menyebut hari, bulan, tanggal, dan hitungan benda.',
core:T(0,[['月 げつ','火 か','水 すい','木 もく'],['金 きん','土 ど','日 にち','+ 曜日 ようび']])+'<p>Bulan: 数字 + <b>月 がつ</b> (一月 いちがつ ... 十二月 じゅうにがつ); khusus 四月 <b>しがつ</b>, 七月 <b>しちがつ</b>, 九月 <b>くがつ</b>. Tanggal 1–10: ついたち, ふつか, みっか, よっか, いつか, むいか, なのか, ようか, ここのか, とおか; tanggal 20 = <b>はつか</b>. Hitungan benda: ひとつ, ふたつ, みっつ, よっつ, いつつ, むっつ, ななつ, やっつ, ここのつ, とお.</p>',
ex:'<p class=jp>'+R('今日','きょう')+'は'+R('何曜日','なんようび')+'ですか。<br><span class=mu>Hari ini hari apa?</span><br>'+R('三月','さんがつ')+R('五日','いつか')+'です。 <span class=mu>Tanggal 5 Maret.</span><br>りんごをみっつください。 <span class=mu>Tolong tiga apel.</span></p>',
cmp:'Tanggal 1–10, 14, 20, dan 24 punya bacaan khusus; sisanya angka + にち. Hitungan つ hanya sampai 10; setelah itu memakai angka biasa.',
mis:'Membaca 四月 "よんがつ"; membaca 五日 "ごにち"; membaca 二十日 "にじゅうにち"; menyamakan 一日 (ついたち, tanggal 1) dengan いちにち (satu hari).',
p:[['Bacaan 四月?',['しがつ','よんがつ','よがつ','しいがつ'],'4 bulan = しがつ.'],['三日 (tanggal 3) dibaca?',['みっか','さんにち','みか','さんか'],'三日 = みっか.'],['Arti 月曜日?',['Senin','Selasa','Minggu','Sabtu'],'月 = bulan, 月曜日 = Senin.']],
e:[['Arti 木曜日?',['Kamis','Jumat','Rabu','Selasa'],'木曜日 = Kamis.'],['五日 (tanggal 5) dibaca?',['いつか','ごにち','ごか','いっか'],'五日 = いつか.'],['"Dua buah" (hitungan つ)?',['ふたつ','ににつ','ふつ','にっつ'],'ふたつ.'],['Bacaan 九月?',['くがつ','きゅうがつ','くげつ','きゅげつ'],'九月 = くがつ.'],['二十日 (tanggal 20) dibaca?',['はつか','にじゅうにち','ふたじゅうか','にじゅうか'],'二十日 = はつか.']]}
});
Object.assign(CT,{
'N5.3.0':{k:8,g:'Membentuk kalimat lampau dan negatif lampau dengan kata sifat い dan な.',
core:T(0,[['','Kini','Lampau','Negatif lampau'],['い-adj 大きい','大きいです','大きかったです','大きくなかったです'],['な-adj 静か','静かです','静かでした','静かじゃありませんでした'],['いい','いいです','よかったです','よくなかったです']])+'<p>い-adj: buang い, tambah <b>かったです</b>. な-adj dan kata benda: <b>でした</b>. いい (baik) berubah menjadi よい → よかったです.</p>',
ex:'<p class=jp>'+R('昨日','きのう')+'は'+R('暑','あつ')+'かったです。<br><span class=mu>Kemarin panas.</span><br>テストは'+R('簡単','かんたん')+'でした。<br><span class=mu>Tesnya mudah.</span><br>'+R('映画','えいが')+'は'+R('面白','おもしろ')+'くなかったです。 <span class=mu>Filmnya tidak menarik.</span></p>',
cmp:'い-adj: かった / くなかった. な-adj: でした / じゃありませんでした. Jangan menukar polanya.',
mis:'高いでした (salah, seharusnya 高かったです); 静かかったです (salah); いいかったです (seharusnya よかったです).',
p:[['Lampau 大きい?',['大きかったです','大きいでした','大きくでした','大きいかったです'],'い → かったです.'],['Lampau 静か?',['静かでした','静かかったです','静かくなかった','静かいでした'],'な-adj + でした.'],['Lampau いい?',['よかったです','いかったです','いいでした','よいでした'],'いい → よかったです.']],
e:[['Negatif lampau 暑い?',['暑くなかったです','暑いじゃなかったです','暑かなかったです','暑ないでした'],'い → くなかったです.'],['Negatif lampau きれい?',['きれいじゃありませんでした','きれくなかったです','きれいくなかったです','きれいなかったです'],'な-adj + じゃありませんでした.'],['楽しかったです berarti?',['Menyenangkan (dulu)','Tidak menyenangkan','Akan menyenangkan','Menyenangkan (kini)'],'〜かったです = lampau.'],['Kalimat benar?',['昨日は寒かったです','昨日は寒いでした','昨日は寒くでした','昨日は寒だった'],'寒い → 寒かったです.'],['Lampau 簡単?',['簡単でした','簡単かったです','簡単んかったです','簡単いでした'],'簡単 = な-adj.']]},
'N5.3.1':{k:10,g:'Mengenali kelompok kata kerja dan membentuk bentuk て.',
core:'<p><b>Kelompok 2</b> (berakhir る setelah i/e): 食べる, 見る → buang る + て. <b>Kelompok 3</b>: する → して, 来る → きて. <b>Kelompok 1</b> (lainnya) berubah menurut akhiran:</p>'+T(0,[['う・つ・る → って','買う→買って'],['む・ぶ・ぬ → んで','飲む→飲んで'],['く → いて','書く→書いて'],['ぐ → いで','泳ぐ→泳いで'],['す → して','話す→話して'],['行く (khusus)','行って']]),
ex:'<p class=jp>'+R('本','ほん')+'を'+R('読','よ')+'んで、'+R('寝','ね')+'ます。<br><span class=mu>Membaca buku, lalu tidur.</span><br>'+R('毎日','まいにち')+R('日本語','にほんご')+'を'+R('書','か')+'いて'+R('勉強','べんきょう')+'します。</p>',
cmp:'Kelompok 1 punya banyak aturan, kelompok 2 hanya membuang る, kelompok 3 hanya dua kata. 行く (いって) adalah pengecualian.',
mis:'行く → いいて (salah, seharusnya いって); 食べる → 食べって; 飲む → 飲いて.',
p:[['て-form 飲む?',['飲んで','飲みて','飲って','飲いで'],'む → んで.'],['て-form 食べる?',['食べて','食べって','食べんで','食べいて'],'る → て.'],['て-form 書く?',['書いて','書って','書んで','書して'],'く → いて.']],
e:[['て-form 行く?',['行って','行いて','行んで','行きて'],'行く = 行って (pengecualian).'],['て-form 話す?',['話して','話って','話いて','話んで'],'す → して.'],['て-form 遊ぶ?',['遊んで','遊って','遊びて','遊いで'],'ぶ → んで.'],['て-form する?',['して','すって','すんで','しいて'],'する → して.'],['て-form 買う?',['買って','買いて','買んで','買うて'],'う → って.']]},
'N5.3.2':{k:8,g:'Meminta dengan 〜てください dan menyatakan aksi berlangsung atau keadaan dengan 〜ています.',
core:'<p><b>V-て + ください</b> = tolong ~. <b>V-て + います</b> = sedang ~, atau keadaan/kebiasaan (住んでいます tinggal, 結婚しています sudah menikah). Meminta benda: N を ください.</p>',
ex:'<p class=jp>ここに'+R('名前','なまえ')+'を'+R('書','か')+'いてください。<br><span class=mu>Tolong tulis nama di sini.</span><br>いま'+R('勉強','べんきょう')+'しています。<br><span class=mu>Sekarang sedang belajar.</span><br>'+R('東京','とうきょう')+'に'+R('住','す')+'んでいます。 <span class=mu>Tinggal di Tokyo.</span></p>',
cmp:'〜ています bisa berarti sedang (aksi) atau keadaan (住んでいます). 〜てください meminta, 〜ましょう mengajak.',
mis:'住みます untuk "tinggal" (seharusnya 住んでいます); lupa mengubah ke bentuk て; memakai ください setelah bentuk ます.',
p:[['Tolong tulis: 書いて___',['ください','います','ます','でした'],'〜てください.'],['Sedang makan: 食べて___',['います','ください','ました','ません'],'〜ています.'],['読んでください berarti?',['Tolong baca','Sedang membaca','Sudah membaca','Mari membaca'],'〜てください = tolong.']],
e:[['Sedang belajar',['勉強しています','勉強してください','勉強します','勉強しました'],'〜ています.'],['Tolong lihat',['見てください','見ています','見ました','見ません'],'見て + ください.'],['住んでいます berarti?',['Tinggal (di)','Akan pindah','Pernah pindah','Ingin tinggal'],'Keadaan.'],['Tolong tunggu',['待ってください','待ちます','待ちました','待ちません'],'待つ → 待って.'],['Kalimat benar?',['ここに名前を書いてください','ここを名前に書いてください','ここに名前を書きてください','ここで名前を書いて います ください'],'N を V-て ください.']]},
'N5.3.3':{k:8,g:'Membentuk bentuk ない dan meminta larangan dengan 〜ないでください.',
core:'<p><b>Kelompok 1</b>: akhiran u → a + ない (書く→書かない, 飲む→飲まない; う → わない: 買う→買わない). <b>Kelompok 2</b>: buang る + ない (食べない). <b>Kelompok 3</b>: しない, こない. <b>V-ないでください</b> = tolong jangan ~.</p>',
ex:'<p class=jp>'+R('写真','しゃしん')+'を'+R('撮','と')+'らないでください。<br><span class=mu>Tolong jangan memotret.</span><br>'+R('明日','あした')+R('学校','がっこう')+'へ'+R('行','い')+'かない。 <span class=mu>Besok tidak ke sekolah (kasual).</span></p>',
cmp:'ない = negatif kasual; ません = negatif sopan. 〜ないでください = larangan halus, 〜てください = permintaan.',
mis:'買う → 買あない (salah, 買わない); する → すない; 来る → きない.',
p:[['ない 飲む?',['飲まない','飲みない','飲んない','飲むない'],'む → まない.'],['ない 食べる?',['食べない','食べらない','食べくない','食べなす'],'る → ない.'],['Tolong jangan masuk: 入ら___',['ないでください','ずに','ませんでした','ないます'],'〜ないでください.']],
e:[['ない 買う?',['買わない','買かない','買うない','買いない'],'う → わない.'],['ない する?',['しない','すない','せない','しらない'],'する → しない.'],['ない 来る?',['こない','きない','くない','くらない'],'来る → こない.'],['Tolong jangan lihat',['見ないでください','見てください','見ませんでください','見ないください'],'見ない + でください.'],['いかない berarti?',['Tidak pergi (kasual)','Pergi','Sudah pergi','Ayo pergi'],'〜ない = tidak.']]},
'N5.3.4':{k:10,g:'Menyatakan keinginan (〜たい, ほしい), kesukaan, dan kemampuan (すき, じょうず).',
core:'<p><b>V-ます stem + たい</b> = ingin ~ (飲みたい). Negatif: 〜たくない. Objek boleh を atau が. <b>N が ほしい</b> = ingin benda. <b>N が すき/きらい/じょうず/へた</b> = suka/tidak suka/pandai/kurang pandai (selalu memakai が).</p>',
ex:'<p class=jp>'+R('日本語','にほんご')+'を'+R('勉強','べんきょう')+'したいです。<br><span class=mu>Ingin belajar bahasa Jepang.</span><br>'+R('寿司','すし')+'が'+R('好','す')+'きです。<br><span class=mu>Suka sushi.</span><br>'+R('車','くるま')+'が'+R('欲','ほ')+'しいです。 <span class=mu>Ingin mobil.</span></p>',
cmp:'たい untuk kata kerja, ほしい untuk benda. すき, じょうず dan へた memakai が, bukan を.',
mis:'寿司を好きです (seharusnya が); 食べたいます; ほしい setelah kata kerja.',
p:[['Ingin makan: 食べ___',['たいです','ましたいです','ますたい','たです'],'V-stem + たい.'],['Suka sushi: 寿司__好きです',['が','を','に','で'],'すき memakai が.'],['Ingin mobil: 車__ほしいです',['が','を','に','へ'],'ほしい memakai が.']],
e:[['飲みたくないです berarti?',['Tidak ingin minum','Ingin minum','Tidak minum','Sudah minum'],'〜たくない = tidak ingin.'],['Pandai bernyanyi',['歌が上手です','歌を上手です','歌が上手ます','歌に上手です'],'じょうず memakai が.'],['へた berarti?',['kurang pandai','pandai','suka','ingin'],'下手 = kurang pandai.'],['Ingin pergi: 行き___',['たいです','いたいです','ますたい','たです'],'行き + たい.'],['ほしい dipakai untuk?',['benda','kata kerja','tempat','waktu'],'ほしい = ingin benda.']]}

function bk(){if(S.dg&&S.dg.on)return'<p class=mu>Cadangan dikunci selama di dalam dungeon.</p>';return`<div class=c><p class=mu>Salin kode ini ke catatan Anda. Tempel kembali di kotak untuk memulihkan progres di perangkat lain.</p><textarea id=bk rows=4 style="width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px" onfocus="this.select()">${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea><button onclick="cp()">Salin</button> <button onclick="rs()">Pulihkan dari kotak</button></div>`}
function rs(){if(S.dg&&S.dg.on)return;try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim()))));if(typeof o.xp!='number'||!o.done)throw 0;if((S.xp>0||Object.keys(S.done||{}).length)&&!rs.ok){rs.ok=1;toast('Sudah ada progres di sini. Tekan Pulihkan sekali lagi untuk menimpa');setTimeout(()=>{rs.ok=0},6000);return}rs.ok=0;S=Object.assign({done:{},last:{},hist:[],err:{},xp:0,day:{},st:{},rank:0},o);save();go('home');toast('Progres dipulihkan')}catch(e){toast('Kode tidak valid')}}
function cp(){if(S.dg&&S.dg.on)return;const t=$('#bk');t.focus();t.select();try{t.setSelectionRange(0,t.value.length)}catch(e){}let ok=0;try{ok=document.execCommand('copy')}catch(e){}if(ok)return toast('Tersalin');if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Tersalin'),()=>toast('Kode terpilih, salin manual'));else toast('Kode terpilih, salin manual')}
function tf(){S.nf=!S.nf;save();document.documentElement.classList.toggle('nf',!!S.nf)}
Object.assign(CT,{
'N5.4.0':{k:8,g:'Meminta/memberi izin (〜てもいい) dan melarang (〜てはいけません).',core:'<p><b>V-て + もいいです</b> = boleh ~. Tanya: 〜てもいいですか。 Jawab ya: はい、いいですよ。 Menolak halus: すみません、ちょっと…<br><b>V-て + はいけません</b> = tidak boleh ~ (larangan tegas).</p>',ex:'<p class=jp>ここで'+R('写真','しゃしん')+'をとってもいいですか。<br><span class=mu>Bolehkah memotret di sini?</span><br>ここでたばこをすってはいけません。<br><span class=mu>Tidak boleh merokok di sini.</span><br>'+R('入','はい')+'ってもいいです。 <span class=mu>Boleh masuk.</span></p>',cmp:'〜てもいい = izin; 〜てはいけません = larangan; 〜ないでください = permintaan halus agar tidak melakukan.',mis:'食べるもいいです (harus bentuk て: 食べてもいい); 〜てはいけます (seharusnya いけません).',p:[['Boleh membuka jendela: まどをあけ___いいですか',['ても','たも','るも','ないも'],'V-て + もいいですか。'],['Dilarang parkir: ここにとめ___いけません',['ては','ても','たら','ない'],'V-て + はいけません。'],['Menolak izin dengan halus',['すみません、ちょっと…','はい、どうぞ','いいですよ','もちろん'],'Penolakan halus: ちょっと…']],e:[['〜てもいいですか berarti?',['Bolehkah ~?','Harus ~','Ingin ~','Sudah ~'],'て + もいいですか = bolehkah.'],['Tidak boleh masuk',['入ってはいけません','入ってもいいです','入りましょう','入っています'],'〜てはいけません = dilarang.'],['しゃしんをとって___。(dilarang)',['はいけません','もいいです','ください','ましょう'],'とっては + いけません.'],['Pasangan yang benar?',['飲んでもいいです','飲むてもいいです','飲みてもいいです','飲んではいいです'],'飲む → 飲んで + もいいです.'],['Arti ここでたばこをすってはいけません',['Tidak boleh merokok di sini','Boleh merokok di sini','Ingin merokok','Jangan lupa merokok'],'〜てはいけません = dilarang.']]},
'N5.4.1':{k:8,g:'Membedakan は (topik) dan が (subjek/info baru), memakai や untuk daftar sebagian, serta ね dan よ.',core:'<p><b>は</b> = topik/kontras. <b>が</b> = subjek/info baru; wajib untuk kata tanya sebagai subjek (だれが, なにが) dan dengan すき, じょうず, ほしい, わかる, あります/います.<br><b>や</b> = dan (daftar sebagian); <b>と</b> = dan (lengkap).<br><b>ね</b> = minta persetujuan. <b>よ</b> = memberi tahu hal yang mungkin belum diketahui lawan bicara.</p>',ex:'<p class=jp>'+R('私','わたし')+'は'+R('学生','がくせい')+'です。<br><span class=mu>Saya pelajar.</span><br>'+R('誰','だれ')+'が'+R('来','き')+'ましたか。<br><span class=mu>Siapa yang datang?</span><br>りんごやバナナがあります。 <span class=mu>Ada apel, pisang, dll.</span><br>いいてんきですね。 <span class=mu>Cuacanya bagus ya.</span></p>',cmp:'は = topik yang sudah diketahui; が = info baru. や = contoh sebagian, と = daftar lengkap. ね = konfirmasi, よ = informasi.',mis:'だれは来ましたか (seharusnya だれが); memakai と padahal daftarnya belum lengkap (pakai や).',p:[['Siapa yang datang? だれ___きましたか',['が','は','を','の'],'Kata tanya sebagai subjek memakai が.'],['Apel, pisang, dan lainnya: りんご___バナナがあります',['や','と','を','に'],'や = daftar sebagian.'],['Minta persetujuan: いいてんきです___',['ね','よ','か','の'],'ね = ya?']],e:[['にほんご___すきです。',['が','を','に','で'],'すき memakai が.'],['Memberi tahu: これはおいしいです___',['よ','ね','の','と'],'よ = memberi tahu.'],['Arti 〜や〜',['dan, dll (sebagian)','atau','tetapi','lalu'],'や = contoh sebagian daftar.'],['わたし___がくせいです。',['は','が','を','に'],'は menandai topik.'],['Daftar lengkap dua benda',['りんごとバナナ','りんごやバナナ','りんごがバナナ','りんごをバナナ'],'と = lengkap.']]},
'N5.4.2':{k:8,g:'Menyatakan alasan dengan から dan pertentangan dengan が (tetapi).',core:'<p><b>Alasan + から、Akibat</b> = karena ~, maka ~ (から diletakkan setelah alasan): あめですから、いえにいます。<br>Tanya: <b>どうして?</b> — Jawab: <b>〜からです</b>.<br><b>Kalimat 1 + が、Kalimat 2</b> = ~, tetapi ~. Santai: けど.</p>',ex:'<p class=jp>'+R('雨','あめ')+'ですから、'+R('家','いえ')+'にいます。<br><span class=mu>Karena hujan, saya di rumah.</span><br>どうして'+R('休','やす')+'みましたか。…'+R('病気','びょうき')+'ですから。<br><span class=mu>Mengapa libur? Karena sakit.</span><br>この'+R('店','みせ')+'は'+R('安','やす')+'いですが、おいしくないです。<br><span class=mu>Toko ini murah, tetapi tidak enak.</span></p>',cmp:'から = sebab (alasan di depannya); が = kontras.',mis:'から diletakkan sebelum alasan; memakai が untuk menyatakan sebab.',p:[['Karena hujan, tidak pergi: あめです___、いきません',['から','が','を','に'],'から = karena.'],['Murah tetapi tidak enak: やすいです___、おいしくないです',['が','から','を','で'],'が = tetapi.'],['Jawaban どうして: びょうきです___',['から','が','です','を'],'どうして → 〜から.']],e:[['Jawaban どうして berakhir dengan?',['〜からです','〜がです','〜をです','〜にです'],'Alasan: 〜からです.'],['いそがしいですから berarti?',['karena sibuk','tetapi sibuk','agar sibuk','kalau sibuk'],'から = karena.'],['Santai untuk が (tetapi)',['けど','から','ので','だから'],'けど = tetapi (santai).'],['すきですが、たかいです berarti?',['Suka, tetapi mahal','Suka karena mahal','Suka lalu mahal','Karena suka, mahal'],'が = tetapi.'],['Karena sakit, tidak sekolah',['びょうきですから、がっこうにいきません','びょうきですが、がっこうにいきません','から びょうきです、がっこうにいきません','びょうきを、がっこうにいきません'],'Alasan + から + akibat.']]},
'N5.4.3':{k:8,g:'Membandingkan dua hal (より, のほうが) dan menyatakan paling (いちばん).',core:'<p><b>A は B より ~です</b> = A lebih ~ daripada B. <b>A と B と どちらが ~ですか</b> → <b>A のほうが ~です</b>. <b>N のなかで なにが いちばん ~ですか</b> → <b>X がいちばん ~です</b>.</p>',ex:'<p class=jp>'+R('電車','でんしゃ')+'はバスより'+R('速','はや')+'いです。<br><span class=mu>Kereta lebih cepat daripada bus.</span><br>'+R('肉','にく')+'と'+R('魚','さかな')+'とどちらがすきですか。…'+R('魚','さかな')+'のほうがすきです。<br><span class=mu>Daging atau ikan, mana yang lebih disukai? Ikan.</span><br>'+R('果物','くだもの')+'のなかでりんごがいちばんすきです。<br><span class=mu>Di antara buah, paling suka apel.</span></p>',cmp:'より menandai pembanding (yang kalah); のほうが menandai yang unggul; いちばん = paling.',mis:'Menaruh より setelah yang unggul; menjawab tanpa のほうが.',p:[['Kereta lebih cepat dari bus: でんしゃはバス___はやいです',['より','から','まで','ほど'],'より = daripada.'],['Mana lebih suka? にくとさかな___どちらがすきですか',['と','や','が','を'],'AとBとどちら…'],['Paling suka: くだもののなかで りんごが___すきです',['いちばん','もっと','とても','すこし'],'いちばん = paling.']],e:[['のほうが dipakai untuk?',['menunjuk yang lebih ~','menunjuk yang paling ~','sebab','larangan'],'のほうが = yang lebih.'],['ねこよりいぬのほうがすきです',['Lebih suka anjing daripada kucing','Lebih suka kucing daripada anjing','Suka keduanya','Tidak suka keduanya'],'いぬ = yang unggul.'],['どうぶつの___なにがいちばんすきですか',['なかで','うえで','あとで','まえで'],'〜のなかで = di antara.'],['Pertanyaan membandingkan dua hal',['AとBとどちらが…ですか','AがBをどちら…','AはBがいちばん…','AよりBまで…'],'AとBとどちらが.'],['とうきょうはおおさか___おおきいです。',['より','から','だけ','しか'],'より = daripada.']]},
'N4.0.0':{k:10,g:'Pola bentuk て tingkat N4: 〜てから, 〜てみる, 〜ておく, 〜てしまう.',core:'<p><b>V-て + から</b> = setelah ~. <b>V-て + みる</b> = mencoba ~. <b>V-て + おく</b> = melakukan ~ lebih dulu (persiapan). <b>V-て + しまう</b> = terlanjur / tuntas ~ (lisan: 〜ちゃう).</p>',ex:'<p class=jp>'+R('食','た')+'べてから、'+R('薬','くすり')+'をのみます。<br><span class=mu>Setelah makan, minum obat.</span><br>この'+R('服','ふく')+'をきてみてもいいですか。<br><span class=mu>Boleh mencoba baju ini?</span><br>'+R('旅行','りょこう')+'のまえに、ホテルをよやくしておきます。<br><span class=mu>Sebelum liburan, pesan hotel dulu.</span><br>さいふをわすれてしまいました。 <span class=mu>Dompetku terlanjur tertinggal.</span></p>',cmp:'てから = urutan; てみる = coba; ておく = persiapan; てしまう = terlanjur/tuntas (sering menyiratkan penyesalan).',mis:'〜てから dengan bentuk kamus (食べるから = karena makan); salah menyusun 〜みてます.',p:[['Setelah makan: たべ___、くすりをのみます',['てから','るから','たから','ないから'],'V-て + から = setelah.'],['Mencoba memakai: きて___',['みる','おく','しまう','いる'],'V-て + みる = mencoba.'],['Persiapan dulu: よやくして___',['おく','みる','しまう','ある'],'V-て + おく = menyiapkan lebih dulu.']],e:[['〜てしまいました sering berarti?',['terlanjur / tuntas','sedang','akan','belum'],'しまう = terlanjur/tuntas.'],['Mandi lalu tidur',['おふろにはいってからねます','おふろにはいるからねます','ねるからおふろにはいります','おふろにはいりませんからねます'],'V-て + から.'],['Boleh mencoba? きて___もいいですか',['みて','おいて','しまって','から'],'きてみてもいい.'],['Persiapan sebelum rapat',['しりょうをよんでおきます','しりょうをよんでしまいます','しりょうをよんでみます','しりょうをよんでからいます'],'ておく = persiapan.'],['ちゃった (lisan) = ?',['〜てしまった','〜てみた','〜ておいた','〜てから'],'ちゃう = てしまう.']]},
'N4.0.1':{k:10,g:'Pola bentuk ない dan た: 〜なければなりません, 〜なくてもいい, 〜たことがある, 〜たほうがいい.',core:'<p><b>V-ない → なければなりません</b> = harus ~. <b>V-なくてもいいです</b> = tak perlu ~. <b>V-た + ことがあります</b> = pernah ~. <b>V-た + ほうがいいです</b> = sebaiknya ~; <b>V-ない + ほうがいいです</b> = sebaiknya tidak ~.</p>',ex:'<p class=jp>'+R('毎日','まいにち')+R('勉強','べんきょう')+'しなければなりません。<br><span class=mu>Harus belajar tiap hari.</span><br>あした'+R('来','こ')+'なくてもいいです。 <span class=mu>Besok tak perlu datang.</span><br>'+R('富士山','ふじさん')+'にのぼったことがあります。 <span class=mu>Pernah mendaki Fuji.</span><br>はやくねたほうがいいですよ。 <span class=mu>Sebaiknya tidur cepat.</span></p>',cmp:'ほうがいい: bentuk た = anjuran melakukan; bentuk ない = anjuran tidak melakukan. ことがある = pengalaman (bentuk た).',mis:'のぼるたことがある (seharusnya のぼったことがある); なければいいです (artinya lain dari なければなりません).',p:[['Harus belajar: べんきょうし___なりません',['なければ','なくても','ないで','ずに'],'〜なければなりません.'],['Pernah naik: のぼっ___ことがあります',['た','て','る','ない'],'V-た + ことがある.'],['Sebaiknya tidur cepat: ねた___いいです',['ほうが','ことが','ために','まえに'],'V-た + ほうがいい.']],e:[['来なくてもいいです berarti?',['Tak perlu datang','Harus datang','Ingin datang','Pernah datang'],'なくてもいい = tak perlu.'],['Pernah makan sushi',['すしをたべたことがあります','すしをたべるほうがあります','すしをたべなければあります','すしをたべてことがあります'],'V-た + ことがある.'],['Sebaiknya tidak merokok',['すわないほうがいいです','すったほうがいいです','すいたほうがいいです','すうことがいいです'],'V-ない + ほうがいい.'],['行かなければなりません berarti?',['Harus pergi','Tak perlu pergi','Boleh pergi','Ingin pergi'],'なければなりません = harus.'],['Bentuk ない dari 飲む',['飲まない','飲みない','飲むない','飲んない'],'Kelompok 1: む → ま + ない.']]},
'N4.0.2':{k:10,g:'Pola bentuk kamus: 〜ことができる, 〜まえに, 〜つもり, しゅみは〜こと.',core:'<p><b>V-kamus + ことができます</b> = bisa ~. <b>V-kamus + まえに</b> = sebelum ~. <b>V-kamus + つもりです</b> = berencana ~ (negatif: V-ない + つもり). <b>しゅみは V-kamus + ことです</b> = hobiku ~.</p>',ex:'<p class=jp>'+R('日本語','にほんご')+'を'+R('話','はな')+'すことができます。 <span class=mu>Bisa berbicara bahasa Jepang.</span><br>'+R('寝','ね')+'るまえに、'+R('歯','は')+'をみがきます。 <span class=mu>Sebelum tidur, sikat gigi.</span><br>'+R('来年','らいねん')+'、'+R('日本','にほん')+'へ'+R('行','い')+'くつもりです。 <span class=mu>Tahun depan berencana ke Jepang.</span><br>しゅみは'+R('本','ほん')+'を'+R('読','よ')+'むことです。 <span class=mu>Hobi: membaca buku.</span></p>',cmp:'まえに memakai bentuk kamus; あとで memakai bentuk た.',mis:'ねたまえに (seharusnya ねるまえに); 話しますことができる (harus bentuk kamus).',p:[['Bisa berenang: およぐ___ができます',['こと','もの','ため','よう'],'V-kamus + ことができる.'],['Sebelum tidur: ねる___、はをみがきます',['まえに','あとで','から','ために'],'V-kamus + まえに.'],['Berencana pergi: いく___です',['つもり','ことが','ために','よう'],'V-kamus + つもりです.']],e:[['しゅみはほんをよむ___です',['こと','もの','ところ','ため'],'しゅみは〜ことです.'],['行かないつもりです berarti?',['Berencana tidak pergi','Tidak bisa pergi','Harus pergi','Pernah pergi'],'ないつもり = berencana tidak.'],['Sebelum makan',['たべるまえに','たべたまえに','たべてまえに','たべますまえに'],'まえに + kamus.'],['Setelah makan',['たべたあとで','たべるあとで','たべてあとで','たべますあとで'],'V-た + あとで.'],['日本語を話すことができますか artinya?',['Bisakah berbicara bahasa Jepang?','Sudahkah berbicara?','Haruskah berbicara?','Maukah berbicara?'],'ことができる = bisa.']]},
'N4.1.0':{k:10,g:'Mengungkap keinginan tingkat N4: 〜たがる, ほしがる, 〜てほしい, 〜たかった.',core:'<p><b>V-たい</b> untuk diri sendiri/pertanyaan ke lawan bicara. Orang ketiga: <b>V-たがっています</b>. <b>N をほしがっています</b> = (dia) menginginkan N. <b>V-て + ほしいです</b> = ingin (orang lain) melakukan ~. Lampau: たかったです.</p>',ex:'<p class=jp>'+R('弟','おとうと')+'は'+R('新','あたら')+'しいゲームをほしがっています。 <span class=mu>Adikku menginginkan game baru.</span><br>'+R('母','はは')+'は'+R('旅行','りょこう')+'に'+R('行','い')+'きたがっています。 <span class=mu>Ibu ingin sekali bepergian.</span><br>ちょっと'+R('手伝','てつだ')+'ってほしいです。 <span class=mu>Aku ingin kamu membantu sedikit.</span></p>',cmp:'たい/ほしい = perasaan sendiri; たがる/ほしがる = tampak ingin (orang ketiga); てほしい = harapan kepada orang lain.',mis:'かれはいきたいです (untuk orang ketiga sebaiknya たがっています); わたしはほしがっています (salah).',p:[['Adik ingin pergi: おとうとはいき___います',['たがって','たくて','たいで','たかって'],'V-たがっています.'],['Ingin kamu membantu: てつだって___です',['ほしい','たい','たがる','ほしがる'],'V-て + ほしい.'],['Dia menginginkan game: ゲームを___います',['ほしがって','ほしくて','たがって','ほしいで'],'ほしがる.']],e:[['たかったです berarti?',['Dulu ingin','Akan ingin','Tidak ingin','Mungkin ingin'],'たかった = lampau.'],['Orang ketiga ingin makan',['たべたがっています','たべたいです','たべほしいです','たべてほしいです'],'たがる untuk orang ketiga.'],['手伝ってほしい artinya?',['ingin dibantu','ingin membantu','harus membantu','boleh membantu'],'てほしい = harapan kepada orang lain.'],['Kepada teman: なにが___ですか',['ほしい','ほしがる','たがる','ほしがって'],'Bertanya kepada lawan bicara memakai ほしい.'],['Orang ketiga menginginkan buku',['ほんをほしがっています','ほんがほしいです','ほんをほしいです','ほんをたがっています'],'ほしがる + を.']]},
'N4.1.1':{k:10,g:'Membandingkan lebih luas: 〜ほど〜ない, おなじくらい, 〜ぐらい.',core:'<p><b>A は B ほど ~ない</b> = A tidak se~ B. <b>A は B と おなじくらい ~</b> = A sama ~ dengan B. <b>A は B より ~</b> = A lebih ~ dari B. <b>~くらい／ぐらい</b> = kira-kira ~.</p>',ex:'<p class=jp>'+R('今日','きょう')+'は'+R('昨日','きのう')+'ほど'+R('寒','さむ')+'くないです。 <span class=mu>Hari ini tak sedingin kemarin.</span><br>'+R('兄','あに')+'は'+R('私','わたし')+'とおなじくらい'+R('背','せ')+'が'+R('高','たか')+'いです。 <span class=mu>Kakak setinggi aku.</span><br>'+R('駅','えき')+'まで'+R('十分','じゅっぷん')+'ぐらいです。 <span class=mu>Ke stasiun sekitar 10 menit.</span></p>',cmp:'ほど selalu dengan bentuk negatif; より bisa dengan positif; おなじくらい = setara; くらい = perkiraan.',mis:'ほど dengan kalimat positif; lupa ない pada ほど.',p:[['Tak sedingin kemarin: きのう___さむくないです',['ほど','より','くらい','だけ'],'ほど + negatif.'],['Setara: わたしと___くらいせがたかいです',['おなじ','ちがう','もっと','いちばん'],'おなじくらい.'],['Kira-kira 10 menit: じゅっぷん___です',['ぐらい','より','しか','だけ'],'ぐらい = kira-kira.']],e:[['ほど berpasangan dengan?',['bentuk negatif','bentuk positif','bentuk lampau saja','bentuk kamus saja'],'AはBほど〜ない.'],['Tak setinggi kakak',['あにほどたかくないです','あによりたかくないです','あにほどたかいです','あにだけたかくないです'],'ほど + ない.'],['Arti くらい?',['kira-kira','sama sekali','paling','hanya'],'くらい = perkiraan.'],['Mana lebih suka? コーヒーとおちゃと___',['どちらが','どれが','だれが','いつが'],'AとBとどちらが.'],['Lebih mahal daripada buku',['ほんよりたかいです','ほんほどたかいです','ほんぐらいたかくないです','ほんだけたかいです'],'より = daripada (positif).']]},
'N4.1.2':{k:10,g:'Izin, larangan, dan keharusan N4: 〜てもかまいません, 〜てはなりません, 〜ないといけません, 〜ことになっている.',core:'<p><b>V-て + もかまいません</b> = tak masalah jika ~ (izin sopan). <b>V-て + はなりません</b> = tidak boleh ~ (larangan formal/aturan). <b>V-ない + といけません</b> = harus ~ (lebih lisan dari なければなりません). <b>V-kamus/ない + ことになっています</b> = sudah menjadi aturan ~.</p>',ex:'<p class=jp>ここで'+R('食','た')+'べてもかまいません。 <span class=mu>Makan di sini tak apa-apa.</span><br>'+R('図書館','としょかん')+'で'+R('大','おお')+'きい'+R('声','こえ')+'で'+R('話','はな')+'してはなりません。 <span class=mu>Dilarang bicara keras di perpustakaan.</span><br>'+R('薬','くすり')+'をのまないといけません。 <span class=mu>Harus minum obat.</span><br>ここでは'+R('靴','くつ')+'をぬぐことになっています。 <span class=mu>Di sini aturannya melepas sepatu.</span></p>',cmp:'かまいません = izin halus; てはなりません = larangan keras/aturan; ないといけません ≈ なければなりません.',mis:'のんでないといけません (seharusnya のまないと); てはなりません untuk percakapan akrab (terlalu kaku).',p:[['Tak apa makan: たべて___',['もかまいません','はなりません','ないといけません','ことになります'],'てもかまいません.'],['Harus minum obat: のま___いけません',['ないと','なくて','ずに','ないで'],'V-ない + といけません.'],['Aturan melepas sepatu: ぬぐ___になっています',['こと','もの','よう','ため'],'ことになっています.']],e:[['てはなりません menyatakan?',['larangan formal','izin','keinginan','pengalaman'],'てはなりません = dilarang.'],['Boleh duduk di sini (sopan)',['すわってもかまいません','すわってはなりません','すわらないといけません','すわることになりません'],'てもかまいません.'],['Arti 帰らないといけません',['Harus pulang','Tak perlu pulang','Boleh pulang','Ingin pulang'],'ないといけません = harus.'],['Seragam wajib di perusahaan ini',['ふくをきることになっています','ふくをきてもかまいません','ふくをきたいです','ふくをきたことがあります'],'ことになっています = aturan.'],['Dilarang masuk (papan)',['はいってはなりません','はいってもかまいません','はいりたいです','はいらなくてもいいです'],'Papan formal: てはなりません.']]}
});
Object.assign(CT,{
'N3.0.0':{k:12,g:'Kalimat pasif: bentuk される/られる, pasif langsung dan pasif penderitaan.',core:'<p><b>Kelompok 1:</b> a-gojuuon + れる (書かれる, 読まれる). <b>Kelompok 2:</b> stem + られる (食べられる). <b>する → される, 来る → こられる</b>. Pelaku ditandai <b>に</b>: 先生にほめられた。 Pasif penderitaan (merugikan subjek): 雨に降られた (kehujanan). Karya/benda: 〜によって (dibuat oleh).</p>',ex:'<p class=jp>'+R('先生','せんせい')+'に'+R('名前','なまえ')+'を'+R('呼','よ')+'ばれました。 <span class=mu>Namaku dipanggil guru.</span><br>'+R('電車','でんしゃ')+'で'+R('足','あし')+'を'+R('踏','ふ')+'まれました。 <span class=mu>Kakiku terinjak di kereta.</span><br>この'+R('本','ほん')+'は'+R('世界中','せかいじゅう')+'で'+R('読','よ')+'まれています。 <span class=mu>Buku ini dibaca di seluruh dunia.</span></p>',cmp:'Aktif: 先生が私をほめた. Pasif: 私は先生にほめられた. Pasif penderitaan menyiratkan subjek terganggu, bahkan pada kata kerja tanpa objek.',mis:'Memakai を setelah pelaku (先生をほめられた); memakai 食べれる (bentuk potensial) untuk pasif.',p:[['Dipuji guru: せんせいに ほめ___',['られた','れた','させた','ている'],'Kelompok 2: stem + られる.'],['Dipanggil: なまえを よば___',['れた','られた','せた','た'],'Kelompok 1: よぶ → よばれる.'],['Pelaku pasif ditandai?',['に','を','が','で'],'Pelaku ditandai に.']],e:[['書く dalam bentuk pasif',['書かれる','書ける','書かせる','書きれる'],'Kelompok 1: か → かれる.'],['食べる dalam bentuk pasif',['食べられる','食べれる','食べさせる','食べらせる'],'Kelompok 2: 〜られる.'],['雨に降られた berarti?',['Kehujanan (merugikan)','Hujan turun','Menurunkan hujan','Ingin hujan'],'Pasif penderitaan.'],['する dalam bentuk pasif',['される','せられる','すれる','させる'],'する → される.'],['Buku ini dibaca banyak orang',['この本は多くの人に読まれています','この本は多くの人を読まれています','この本は多くの人が読ませています','この本は多くの人に読めています'],'Pasif: に + 読まれる.']]},
'N3.0.1':{k:12,g:'Kausatif: 〜せる/させる (menyuruh atau mengizinkan) dan kausatif-pasif.',core:'<p><b>Kelompok 1:</b> a-gojuuon + せる (書かせる). <b>Kelompok 2:</b> stem + させる (食べさせる). <b>する → させる, 来る → こさせる</b>. Pola: <b>A は B に/を V-させる</b> — に jika kata kerja punya objek (を), を jika tanpa objek. <b>〜させてください</b> = izinkan saya ~. Kausatif-pasif <b>V-させられる</b> = dipaksa ~.</p>',ex:'<p class=jp>'+R('母','はは')+'は'+R('子供','こども')+'に'+R('野菜','やさい')+'を'+R('食','た')+'べさせます。 <span class=mu>Ibu menyuruh anak makan sayur.</span><br>ちょっと'+R('休','やす')+'ませてください。 <span class=mu>Izinkan saya istirahat sebentar.</span><br>'+R('部長','ぶちょう')+'に'+R('残業','ざんぎょう')+'をさせられました。 <span class=mu>Dipaksa lembur oleh kepala bagian.</span></p>',cmp:'Kausatif = menyuruh/mengizinkan; pasif = dikenai; kausatif-pasif = dipaksa melakukan.',mis:'Memakai に dan を untuk orang yang sama (子供を野菜を); 食べせる (seharusnya 食べさせる).',p:[['Menyuruh anak makan: こどもに たべ___',['させる','せる','られる','れる'],'Kelompok 2: stem + させる.'],['Izinkan saya pergi: いか___ください',['せて','させて','れて','られて'],'いく → いかせる → いかせて.'],['Dipaksa makan: たべ___',['させられた','させた','られた','せた'],'Kausatif-pasif: させられる.']],e:[['書く dalam bentuk kausatif',['書かせる','書かれる','書ける','書きせる'],'Kelompok 1: か + せる.'],['来る dalam bentuk kausatif',['来させる','来られる','来れる','来かせる'],'来る → こさせる.'],['〜させてください berarti?',['Izinkan saya ~','Tolong ~kan','Jangan ~','Sudah ~'],'させてください = mohon izin.'],['Dipaksa lembur',['残業させられた','残業された','残業させた','残業できた'],'Kausatif-pasif = dipaksa.'],['Ibu menyuruh anak belajar',['母は子供に勉強させる','母は子供が勉強させる','母は子供を勉強される','母は子供に勉強された'],'A は B に〜させる.']]},
'N3.0.2':{k:12,g:'Keigo dasar: sonkeigo (hormat), kenjougo (merendah), dan teineigo (sopan).',core:'<p><b>Sonkeigo</b> (meninggikan orang lain): <b>お/ご + V-stem + になる</b> (お読みになる); khusus: いらっしゃる (行く/来る/いる), おっしゃる (言う), なさる (する), 召し上がる (食べる/飲む), ご覧になる (見る). <b>Kenjougo</b> (merendahkan diri): <b>お/ご + V-stem + する</b> (お持ちする); khusus: 参る (行く/来る), 申す (言う), いたす (する), いただく (食べる/もらう), 拝見する (見る), 伺う (訪ねる/聞く). <b>Teineigo</b>: です・ます.</p>',ex:'<p class=jp>'+R('先生','せんせい')+'は'+R('何','なに')+'を'+R('召','め')+'し'+R('上','あ')+'がりますか。 <span class=mu>Apa yang guru santap?</span><br>'+R('私','わたし')+'が'+R('荷物','にもつ')+'をお'+R('持','も')+'ちします。 <span class=mu>Biar saya bawakan barangnya.</span><br>'+R('山田','やまだ')+'と'+R('申','もう')+'します。 <span class=mu>Nama saya Yamada.</span></p>',cmp:'Sonkeigo = tindakan orang yang dihormati; kenjougo = tindakan diri sendiri terhadap orang yang dihormati; jangan tertukar subjeknya.',mis:'Memakai いらっしゃる untuk diri sendiri; 召し上がります untuk diri sendiri (harus いただきます).',p:[['Guru makan (hormat): せんせいは___',['めしあがります','いただきます','いたします','もうします'],'召し上がる = sonkeigo untuk makan.'],['Saya bawakan: にもつをお___します',['もち','もつ','もって','もた'],'お + V-stem + する.'],['Saya bernama Yamada (merendah)',['もうします','おっしゃいます','なさいます','いらっしゃいます'],'申す = kenjougo 言う.']],e:[['おっしゃる adalah bentuk hormat dari?',['言う','見る','行く','食べる'],'おっしゃる = 言う.'],['いただきます dipakai untuk?',['diri sendiri makan/menerima','orang lain makan','orang lain pergi','orang lain berkata'],'いただく = kenjougo.'],['Bentuk hormat 読む',['お読みになる','お読みする','読まれまする','読みなさる'],'お + V-stem + になる.'],['行く (merendah, diri sendiri)',['参る','いらっしゃる','おいでになる','なさる'],'参る = kenjougo.'],['見る (hormat untuk orang lain)',['ご覧になる','拝見する','見ていただく','見させる'],'ご覧になる = sonkeigo.']]}
});
Object.assign(CT,{
'N3.1.0':{k:12,g:'Membaca artikel pendek: menemukan gagasan utama dan memahami kata penghubung.',core:'<p>Kata penghubung umum: <b>しかし</b> (namun), <b>そのため</b> (oleh karena itu), <b>さらに</b> (selain itu), <b>一方で</b> (di sisi lain). Gagasan utama biasanya ada di kalimat awal atau akhir paragraf. Perhatikan <b>〜わけではない</b> (bukan berarti ~) dan <b>〜ことだ</b> (saran) di bagian kesimpulan.</p>',ex:'<p class=jp>毎日、少しずつ日本語を勉強しています。しかし、なかなか話せるようになりません。そのため、今年は会話の練習を増やすつもりです。<br><span class=mu>Setiap hari saya belajar bahasa Jepang sedikit demi sedikit. Namun, sulit sekali bisa berbicara. Oleh karena itu, tahun ini saya berencana menambah latihan percakapan.</span></p>',cmp:'しかし = kontras; そのため = akibat dari kalimat sebelumnya; さらに = menambah; 一方で = membandingkan dua sisi.',mis:'Mengira 〜わけではない berarti tidak sama sekali; melewatkan kata penghubung sehingga alur paragraf hilang.',p:[['Namun, menarik: 日本語は難しい___、おもしろいです',['しかし','そのため','さらに','だから'],'しかし = namun.'],['Akibat hujan lebat: 雨が強かった。___、電車が止まった',['そのため','しかし','さらに','一方で'],'そのため = oleh karena itu.'],['Menambah informasi: 料理がおいしい。___、店員も親切だ',['さらに','しかし','そのため','一方で'],'さらに = selain itu.']],e:[['〜わけではない berarti?',['Bukan berarti tidak ~','Pasti ~','Harus ~','Baru saja ~'],'〜わけではない = tidak selalu / bukan berarti.'],['一方で dipakai untuk?',['Membandingkan dua sisi','Menyatakan sebab','Menambah informasi','Mengakhiri cerita'],'一方で = di sisi lain.'],['Gagasan utama paragraf biasanya ada di?',['Kalimat awal atau akhir','Hanya di tengah','Tidak pernah ada','Setelah contoh saja'],'Periksa awal dan akhir paragraf.'],['Kata penghubung yang tepat: 遅れました。___、すみません',['そのため','しかし','さらに','一方で'],'Sebab-akibat: そのため.'],['Arti 〜ことだ (dalam kesimpulan)',['Sebaiknya ~','Sudah ~','Mustahil ~','Selalu ~'],'〜ことだ = saran/nasihat.']]},
'N3.1.1':{k:12,g:'Menyimak dialog: menangkap kabar, dugaan, dan respons alami (aizuchi).',core:'<p>Saat menyimak, cari kata kunci waktu dan tempat, lalu pola: <b>〜そうです</b> (kabarnya, dari yang didengar), <b>〜ようです</b> (sepertinya, dari bukti atau tanda), <b>〜みたいです</b> (seperti, lebih kasual). Respons alami (aizuchi): <b>はい</b>, <b>そうですか</b>, <b>へえ</b>, <b>なるほど</b>.</p>',ex:'<p class=jp>A：明日、雨が降るそうですよ。<br>B：そうですか。じゃあ、傘を持って行きます。<br><span class=mu>A: Katanya besok akan hujan. B: Begitu ya. Kalau begitu saya bawa payung.</span></p>',cmp:'〜そうです = kabar yang didengar; 〜ようです = berdasarkan bukti yang terlihat; 〜みたいです = lebih kasual dan mirip.',mis:'Memakai 〜そうです untuk dugaan dari tanda (seharusnya 〜ようです); memberi respons datar tanpa aizuchi.',p:[['Katanya besok libur: あした休みだ___',['そうです','ようです','です','ます'],'〜そうです = kabar yang didengar.'],['Sepertinya dia sakit (dilihat dari wajahnya): 彼は具合が悪い___',['ようです','そうです','けど','から'],'〜ようです = dugaan dari bukti.'],['Respons sopan begitu ya: ___',['そうですか','ごちそうさま','いただきます','おめでとう'],'そうですか = aizuchi.']],e:[['〜そうです menyatakan?',['Kabar yang didengar','Perintah','Pertanyaan','Permohonan'],'〜そうです = kabar yang didengar.'],['〜ようです menyatakan?',['Sepertinya, berdasarkan bukti','Pasti','Keinginan','Larangan'],'〜ようです = dugaan dari bukti.'],['へえ dalam percakapan berarti?',['Wah/oh (tertarik)','Maaf','Terima kasih','Sampai jumpa'],'へえ = aizuchi yang menunjukkan ketertarikan.'],['A「今日は休みです」 B___ (respons alami)',['そうなんですか','いってきます','ごめんなさい','いただきます'],'そうなんですか = respons alami.'],['〜みたいです paling mirip dengan?',['Seperti / tampaknya (kasual)','Harus','Baru saja','Ingin'],'〜みたいです = lebih kasual.']]}
});

function sq(k,n=1){const t=new Date().toLocaleDateString('sv');if(S.day.d!=t)S.day={d:t,xp:0,cnt:{}};const s=S.day.sq=S.day.sq||{};s[k]=(s[k]||0)+n;

// ===== KARTU HAFALAN & ADAPTIF =====
const LI={N5:1,N4:2,N3:3,N2:4,N1:5},cm=p=>Object.keys(S.cd||{}).filter(k=>k[0]==p&&S.cd[k].b>=4).length;
function wt(){const a=S.ac||{},ks=['v','r','k','g'],w=ks.map(k=>{const x=a[k];return x&&x[1]>=5?1.6-x[0]/x[1]:1});let r=Math.random()*w.reduce((p,q)=>p+q,0);for(let i=0;i<4;i++){r-=w[i];if(r<=0)return ks[i]}return'v'}

function cardBox(){const d=deck(),cd=S.cd||{},t=new Date().toLocaleDateString('sv'),du=d.filter(c=>cd[c.k]&&cd[c.k].due<=Date.now()).length,nw=Math.min(d.filter(c=>!cd[c.k]).length,Math.max(0,10-(S.day.d==t?S.day.nc||0:0)));return`<div class=c><b>Kartu hafalan</b><p class=mu>${du} kartu jatuh tempo · ${nw} kartu baru hari ini</p><button class=p ${du+nw?'':'disabled'} onclick="cards()">Mulai kartu</button></div>`}

const du=d.filter(c=>S.cd[c.k]&&S.cd[c.k].due<=now),nw=d.filter(c=>!S.cd[c.k]).slice(0,Math.max(0,10-(S.day.nc||0)));S.day.nc=(S.day.nc||0)+nw.length;save();
const q=[...sh(du),...nw],n=q.length;let gx=0;
(function nx(){if(!q.length){M.innerHTML=`<div class=c><h1>Kartu selesai</h1><p>${n} kartu · <b>+${gx} XP</b></p><button class=p onclick="go('rev')">Kembali</button></div>`;return}

// ===== UJIAN RANK (format JLPT) =====
const CUT=[80,90,95,90,100],PS='<div class=jp style="font-weight:400">'+R('私','わたし')+'はマリアです。'+R('学生','がくせい')+'です。'+R('毎日','まいにち')+R('学校','がっこう')+'へ'+R('行','い')+'きます。</div>';

EXB[0].r.push({q:PS2+'Pergi ke mana?',o:['Stasiun','Sekolah','Rumah','Toko'],e:'えきへ = ke stasiun.'},{q:PS2+'Pergi dengan siapa?',o:['Teman','Guru','Sendiri','Keluarga'],e:'ともだちと = dengan teman.'},{q:PS2+'Apa yang dilakukan di stasiun?',o:['Membaca buku','Minum air','Makan roti','Menelepon'],e:'本を読みます = membaca buku.'});
EXB[0].c.push({s:'これは ねこです',q:'Apa ini?',o:['Kucing','Anjing','Buku','Mobil'],e:'ねこ = kucing.'},{s:'みずを のみます',q:'Apa yang dilakukan?',o:['Minum air','Makan nasi','Membaca','Pergi'],e:'みず = air, のみます = minum.'},{s:'まいにち がっこうへ いきます',q:'Seberapa sering ke sekolah?',o:['Setiap hari','Besok','Kemarin','Tidak pernah'],e:'まいにち = setiap hari.'});
Object.values(EXB).forEach(b=>['r','c'].forEach(k=>b[k].forEach((x,i)=>x.i=k+i)));

function examCard(){const r=S.rank;if(r>=5)return'<div class=sy style="margin:10px 0">Rank S tercapai.</div>';const l=lvOf(S.xp),ok=l>=MINL[r+1]&&mq().done>=mq().tot,has=!!EXB[r],cd=S.exl&&Date.now()-S.exl<216e5;

function exam(){const r=S.rank,b=EXB[r],u={},g=[];for(let i=0;i<60&&g.length<8;i++){const q=gen('mix','N5');if(!u[q.id]){u[q.id]=1;Q[q.id]=q;g.push(q)}}
const nc=window.speechSynthesis?'':null,mk=(a,p,f)=>a.map((x,i)=>({g:1,id:'x:'+p+r+x.i,q:f?f(x):x.q,o:x.o,e:x.e})).map(q=>(Q[q.id]=q));

(function nx(){if(k==3)return resExam(sc,r);const s=SEC[k];M.innerHTML=`<div class=c><h1>${s[0]}</h1><p class=mu>Bagian ${k+1}/3 · ${s[1].length} soal · pembahasan muncul setelah ujian selesai.</p><button class=p id=go1>Mulai</button></div>`;$('#go1').onclick=()=>quiz(s[1],'eval',s[0],x=>{sc.push({n:s[0],ok:x.ok,m:x.n,bad:x.bad});k++;nx()})})()}
function resExam(sc,r){const p=sc.map(s=>Math.round(s.ok/s.m*60)),t=p.reduce((a,b)=>a+b,0),pass=t>=CUT[r]&&p.every(x=>x>=19);S.hist.push({d:Date.now(),n:'Ujian rank '+RNK[r][0]+'→'+RNK[r+1][0],p:Math.round(t/180*100)});
if(pass){S.rank++;save();toast(`<div class=sh>[ SISTEM ]</div><b style="font-size:20px">RANK UP!</b><br>${RNK[r][0]}-Rank → ${RNK[r+1][0]}-Rank`,1)}else{S.exl=Date.now();save()}
M.innerHTML=`<div class=sy style="margin:10px 0"><div class=sh>[ HASIL UJIAN ]</div><h1>${pass?'LULUS':'TIDAK LULUS'} · ${t}/180</h1>${sc.map((s,i)=>`<div class=row><span>${s.n}</span><b>${p[i]}/60${p[i]<19?' ⚠':''}</b></div>`).join('')}<p class=mu>Syarat: total ≥ ${CUT[r]} dan tiap bagian ≥ 19.</p></div>`+sc.flatMap(s=>s.bad).map(q=>`<div class=c><b>${q.q}</b><p>Jawaban benar: ${q.o[0]}<br><span class=mu>${q.e}</span></p></div>`).join('')+`<button class=p onclick="go('home')">Beranda</button>`}
// ===== QUIZ ENGINE =====
function quiz(list,mode,title,cb){const xb=/^(⚔|💀)/.test(title);let i=0,ok=0,bad=[],gx=0;
function show(){const q=list[i],os=sh(q.o.map((t,j)=>[t,j]));
M.innerHTML=`<p class=mu>${title} · ${i+1}/${list.length}</p><div class=bar><i style="width:${i/list.length*100}%"></i></div><div class=c><h2 class=jp>${q.q}</h2>${os.map((o,k)=>`<button class=o data-j="${o[1]}" onclick="A(${k})">${o[0]}</button>`).join('')}<div id=fb></div></div>`;window.A=k=>{const b=[...document.querySelectorAll('.o')],j=+b[k].dataset.j,right=j==0;
sfx(right?'ok':'bad');let g=0;const ct=q.id[0]=='g'?q.id[2]:'s',ca=(S.ac=S.ac||{})[ct]=(S.ac||{})[ct]||[0,0];ca[1]++;if(right)ca[0]++;if(right){ok++;const bs={v:2,r:3,k:4,g:6,s:mode=='eval'?6:4}[ct];g=award(ct,bs,.03,.3,'q:'+ct,1,xb);gx+=g;sq('q')}else bad.push(q);

$('#fb').innerHTML=`<p>${right?'✓ Benar. ':'✗ Kurang tepat. '}${q.e}${g?` <b>+${g} XP</b>`:''}</p><button class=p id=nx>${i+1<list.length?'Lanjut →':'Selesai'}</button>`;$('#nx').onclick=next}}
show()}
document.documentElement.classList.toggle('nf',!!S.nf);go('home');
